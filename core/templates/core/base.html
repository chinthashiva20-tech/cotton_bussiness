<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Cotton Trade Manager{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="{% url 'dashboard' %}">🌾 Cotton Trade Manager</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="{% url 'dashboard' %}">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'set_live_price' %}">Live Price</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'purchase_create' %}">New Purchase</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'purchase_list' %}">Purchases</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'sale_create' %}">New Sale</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'sale_list' %}">Sales</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'expense_create' %}">New Expense</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'expense_list' %}">Expenses</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'report_range' %}">Reports / Profit</a></li>
        <li class="nav-item"><a class="nav-link" href="/admin/">Admin</a></li>
      </ul>
    </div>
  </div>
</nav>
<div class="container mb-5">
  {% for message in messages %}
    <div class="alert alert-{{ message.tags }}">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
