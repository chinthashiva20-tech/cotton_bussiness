{% extends "core/base.html" %}
{% block content %}
<h2>Set Today's Live Cotton Price</h2>
<p class="text-muted">Enter manually, or wire <code>services.fetch_live_price_from_web()</code> to your preferred mandi/NCDEX price source to auto-fill this.</p>
<form method="post" class="col-md-5">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="btn btn-primary">Save</button>
</form>
{% endblock %}
